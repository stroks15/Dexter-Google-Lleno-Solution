name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate prototype JavaScript
        run: node --check src/app.js
      - name: Validate JSON config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Check required files
        run: test -s src/index.html && test -s supabase/migrations/202610260001_storage_migration.sql